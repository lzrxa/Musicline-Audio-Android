name: Musicline Android APK Build and Verify
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/android-debug-apk.yml'
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate offline assets and project before building
        run: python3 tools/check_release.py --source-only
      - name: Run existing regression checks
        run: python3 tests/run_v35_checks.py && python3 tests/verify_fft
